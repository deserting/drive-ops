<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heatmaps – Visualisation Tactique</title>
  
  <!-- FONT: INTER + JETBRAINS MONO -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- On remonte d'un cran pour le global, et on charge le local -->
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="css/heatmaps.css" />
</head>
<body>
  
  <div class="tactical-view">
    
    <!-- HEADER FLOTTANT (Minimal) -->
    <header class="tactical-header">
      <div class="header-left">
        <a href="../" class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span class="back-label">HUB</span>
        </a>
        <div class="module-title">
          <span class="module-code">01 // OBSERVATION</span>
          <h1>Heatmaps Picking</h1>
        </div>
      </div>

      <div class="header-right">
        <div class="live-status">
          <span class="status-dot pulse"></span>
          <span>LIVE DATA</span>
        </div>
      </div>
    </header>

    <!-- CONTROLS PANEL (Flottant à gauche) -->
    <aside class="control-panel glass-panel">
      <div class="panel-section">
        <label class="panel-label">ZONE</label>
        <div class="select-wrapper">
          <select id="zone-select" class="tactical-select"></select>
          <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div class="panel-section">
        <label class="panel-label">MODE</label>
        <div id="type-filters" class="toggle-group"></div>
      </div>

      <div class="panel-section">
        <label class="panel-label">SCOPE TEMPOREL</label>
        <div class="date-range">
          <input type="date" id="date-from" class="tactical-input" />
          <span class="range-sep">→</span>
          <input type="date" id="date-to" class="tactical-input" />
        </div>
      </div>

      <div class="panel-footer">
        <div class="stat-mini">
          <span class="stat-label">POINTS</span>
          <span id="total-points" class="stat-val">0</span>
        </div>
        <div class="stat-mini">
          <span class="stat-label">INTENSITÉ MAX</span>
          <span id="max-intensity" class="stat-val">0</span>
        </div>
      </div>
    </aside>

    <!-- MAP VIEWPORT (Le fond de la scène) -->
    <main class="map-viewport" id="plan-viewport">
      <div class="map-stage" id="plan-wrapper">
        <table id="plan-table" class="tactical-grid"></table>
      </div>
      
      <!-- ZOOM CONTROLS (Flottant en bas à droite) -->
      <div class="zoom-controls glass-panel">
        <button id="zoom-out" class="zoom-btn">-</button>
        <span id="zoom-val" class="zoom-display">100%</span>
        <button id="zoom-in" class="zoom-btn">+</button>
      </div>
    </main>

    <!-- LOADING OVERLAY -->
    <div id="loader" class="loader-overlay">
      <div class="loader-spinner"></div>
      <span>INITIALISATION DU SYSTÈME...</span>
    </div>

  </div>

  <!-- TOOLTIP TACTIQUE -->
  <div id="tooltip" class="tactical-tooltip"></div>

  <script src="js/heatmaps.js"></script>
</body>
</html>
